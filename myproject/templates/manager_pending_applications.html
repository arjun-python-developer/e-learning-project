{% extends 'base.html' %}
{% block content %}
<h2 class="fw-bold text-primary mb-3">Pending Course Applications</h2>
<hr>

<table class="table table-hover align-middle">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Student</th>
            <th>Course</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for app in pending_enrollments %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ app.student.username }}</td>
            <td>{{ app.course.title }}</td>
            <td>{{ app.created_at|date:"M d, Y" }}</td>

            <td>
                <a href="{% url 'manager_approve' app.id %}" class="btn btn-success btn-sm">✔ Approve</a>
                <a href="{% url 'manager_reject' app.id %}" class="btn btn-danger btn-sm">✖ Reject</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
