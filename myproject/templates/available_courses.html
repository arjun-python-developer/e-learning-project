{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Available Courses</h2>

    <div class="row">
        {% for course in courses %}
        <div class="col-md-4">
            <div class="card shadow-sm p-3 mb-3">
                <h4>{{ course.title }}</h4>
                <p>{{ course.description|truncatewords:20 }}</p>
                <a href="{% url 'enroll_course' course.id %}" class="btn btn-success">Apply</a>
            </div>
        </div>
        {% endfor %}

        {% if courses|length == 0 %}
        <p>No new courses available.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
