{% extends 'base.html' %}
{% block content %}

<h2>Results for {{ quiz.title }}</h2>

<table class="table table-bordered">
<thead>
<tr>
    <th>#</th>
    <th>Student</th>
    <th>Score</th>
    <th>Submitted On</th>
</tr>
</thead>
<tbody>
{% for r in results %}
<tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ r.student.username }}</td>
    <td>{{ r.score }} / {{ r.total }}</td>
    <td>{{ r.taken_at|date:"d M Y H:i" }}</td>
</tr>
{% empty %}
<tr><td colspan="4">No results yet.</td></tr>
{% endfor %}
</tbody>
</table>

{% endblock %}
